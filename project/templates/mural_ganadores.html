<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Ganadores Sorteo </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0d2302;
            font-family: Arial, sans-serif;
            padding: 10px;
            color: white;
        }

        h1 {
            text-align: center;
            color: #FFD700;
            margin-bottom: 10px;
            font-size: 1.3rem;
        }

        /* Contenedor de columnas */
        #mural {
            display: flex;
            gap: 6px;
            height: 90vh; /* altura fija */
            padding: 5px;
        }

        .columna {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,215,0,0.15);
            border-radius: 5px;
            padding: 3px;
            flex: 1;
            height: 100%;
            overflow: hidden;
        }

        table {
            width: 100%;
            table-layout: fixed;
            font-size: 0.63rem;
            color: white;
        }

        thead {
            display: table;
            width: 100%;
        }

        tbody {
            display: block;
            height: calc(100% - 16px);
            overflow: hidden;
        }

        tr {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        th {
            color: #FFD700;
            text-align: left;
            font-size: 0.62rem;
            border-bottom: 1px solid rgba(255,215,0,0.4);
            padding: 0;
            margin: 0;
        }

        td {
            padding: 0 2px;
            font-size: 0.65rem;
            line-height: 1.05;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        td:first-child {
            width: 22px; /* MÁS CERCA DEL NOMBRE */
            text-align: right;
            padding-right: 3px;
            color: #FFD700;
        }

        .nuevo {
            animation: highlight 2s ease-out;
            background: rgba(255,215,0,0.25) !important;
        }

        @keyframes highlight {
            0%   { background: rgba(255,215,0,0.9); }
            100% { background: rgba(255,215,0,0.05); }
        }
    </style>
</head>
<body>

    <h1>🏆 Ganadores Sorteo 🏆</h1>

    <div id="mural"></div>

    <script>

        const MAX_COLUMNAS = 5;
        const ALTURA_FILA = 15;  // altura aproximada
        const HEIGHT_COLUMNA = 0.95;

        let ganadoresPrevios = [];

        async function cargarGanadores() {

            const resp = await fetch("/api/ganadores-ticker");
            const data = await resp.json();
            if (!data.success) return;

            const ganadores = data.ganadores;

            ganadores.sort((a, b) => a.id - b.id);

            const altoDisponible = window.innerHeight * HEIGHT_COLUMNA;
            const filasPorColumna = Math.floor(altoDisponible / ALTURA_FILA);

            const mural = document.getElementById("mural");
            mural.innerHTML = "";

            let contadorGlobal = 1;
            let itemsEnColumna = 0;
            let columnaActual = crearColumna();
            let tbody = columnaActual.querySelector("tbody");

            for (let g of ganadores) {

                // Si se llena una columna → crear otra
                if (itemsEnColumna >= filasPorColumna) {

                    if (mural.children.length >= MAX_COLUMNAS)
                        break;

                    columnaActual = crearColumna();
                    tbody = columnaActual.querySelector("tbody");

                    itemsEnColumna = 0;
                }

                const esNuevo = !ganadoresPrevios.includes(g.id);

                const tr = document.createElement("tr");
                tr.className = esNuevo ? "nuevo" : "";

                tr.innerHTML = `
                    <td>${contadorGlobal}</td>
                    <td>${g.nombre}</td>
                `;

                tbody.appendChild(tr);

                contadorGlobal++;
                itemsEnColumna++;
            }

            ganadoresPrevios = ganadores.map(g => g.id);
        }

        function crearColumna() {
            const mural = document.getElementById("mural");
            const columna = document.createElement("div");
            columna.classList.add("columna");

            const tabla = document.createElement("table");
            tabla.innerHTML = `
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nombre</th>
                    </tr>
                </thead>
                <tbody></tbody>
            `;

            columna.appendChild(tabla);
            mural.appendChild(columna);
            return columna;
        }

        cargarGanadores();
        setInterval(cargarGanadores, 10000);

    </script>

</body>
</html>
