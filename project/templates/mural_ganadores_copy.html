<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural de Ganadores - Palo Blanco</title>
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" type="image/png">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a5002 50%, #0a0a0a 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            position: relative;
        }

        /* Efecto de partículas en el fondo */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(44, 133, 3, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 215, 0, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(44, 133, 3, 0.1) 0%, transparent 50%);
            animation: particleFloat 20s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes particleFloat {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }

        /* Header mejorado */
        .header {
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.7) 100%);
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            border-bottom: 3px solid #FFD700;
        }

        .header h1 {
            color: #FFD700;
            font-size: 2.5rem;
            margin: 0;
            font-weight: 900;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.9), 0 0 30px rgba(255, 215, 0, 0.5);
            letter-spacing: 2px;
        }

        .header .stats {
            color: #2cff03;
            font-size: 1rem;
            margin-top: 8px;
            font-weight: 600;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        /* Contenedor del mural */
        .mural-container {
            padding: 30px;
            height: calc(100vh - 120px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Grid de ganadores - 7 columnas */
        .winners-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 1600px;
            height: 100%;
            max-height: 650px;
        }

        /* Cada celda de ganador */
        .winner-cell {
            background: linear-gradient(145deg, rgba(44, 133, 3, 0.2), rgba(26, 80, 2, 0.3));
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            backdrop-filter: blur(15px);
            border: 3px solid rgba(255, 215, 0, 0.3);
            transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            opacity: 0;
            transform: scale(0.7) rotateY(90deg);
            box-shadow: 0 8px 25px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }

        .winner-cell::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 215, 0, 0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s ease-in-out infinite;
        }

        @keyframes shine {
            0%, 100% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            50% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .winner-cell.active {
            opacity: 1;
            transform: scale(1) rotateY(0deg);
            border-color: #FFD700;
            box-shadow: 0 10px 35px rgba(255, 215, 0, 0.4), 0 0 20px rgba(44, 133, 3, 0.5);
        }

        .winner-cell.fadeout {
            opacity: 0;
            transform: scale(0.7) rotateY(-90deg);
        }

        /* Fotografía del ganador */
        .winner-cell .photo-container {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            overflow: hidden;
            margin-bottom: 12px;
            border: 4px solid #FFD700;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.5), 0 0 20px rgba(255, 215, 0, 0.3);
            background: linear-gradient(135deg, #2c8503, #1a5002);
            position: relative;
        }

        .winner-cell .photo-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .winner-cell:hover .photo-container img {
            transform: scale(1.1);
        }

        /* Icono de trofeo */
        .winner-cell .trophy {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1.8rem;
            animation: bounce 2s ease-in-out infinite, rotate 4s linear infinite;
            filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.8));
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(10deg); }
        }

        @keyframes rotate {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        /* Nombre del ganador */
        .winner-cell .nombre {
            color: white;
            font-size: 0.95rem;
            line-height: 1.3;
            font-weight: 700;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            letter-spacing: 0.5px;
        }

        /* Mensaje de carga mejorado */
        .loading-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #FFD700;
            font-size: 2rem;
            text-align: center;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.9);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.05); }
        }

        /* Botón de volver mejorado */
        .back-button {
            position: fixed;
            top: 25px;
            left: 25px;
            z-index: 1000;
            background: linear-gradient(135deg, rgba(44, 133, 3, 0.9), rgba(26, 80, 2, 0.9));
            border: 2px solid #FFD700;
            color: white;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .back-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 25px rgba(255, 215, 0, 0.5);
            background: linear-gradient(135deg, #2c8503, #1a5002);
            color: #FFD700;
        }

        /* Notificación de nuevos ganadores */
        .notification-popup {
            position: fixed;
            top: 100px;
            right: -400px;
            background: linear-gradient(135deg, #2c8503, #1a5002);
            color: white;
            padding: 20px 30px;
            border-radius: 15px;
            border: 3px solid #FFD700;
            box-shadow: 0 8px 30px rgba(0,0,0,0.7), 0 0 40px rgba(255, 215, 0, 0.4);
            z-index: 10000;
            font-size: 1.3rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: right 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            backdrop-filter: blur(10px);
        }

        .notification-popup.show {
            right: 30px;
        }

        .notification-popup i {
            font-size: 2rem;
            color: #FFD700;
            animation: sparkle 1s ease-in-out infinite;
        }

        @keyframes sparkle {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.2) rotate(180deg); opacity: 0.8; }
        }

        /* Responsive */
        @media (max-width: 1400px) {
            .winners-grid {
                grid-template-columns: repeat(6, 1fr);
                gap: 15px;
            }

            .winner-cell .photo-container {
                width: 90px;
                height: 90px;
            }
        }

        @media (max-width: 1024px) {
            .winners-grid {
                grid-template-columns: repeat(5, 1fr);
                gap: 12px;
            }

            .winner-cell .photo-container {
                width: 80px;
                height: 80px;
            }

            .winner-cell .trophy {
                font-size: 1.5rem;
            }

            .winner-cell .nombre {
                font-size: 0.85rem;
            }

            .header h1 {
                font-size: 2rem;
            }
        }

        @media (max-width: 768px) {
            .winners-grid {
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: repeat(4, 1fr);
                gap: 10px;
            }

            .winner-cell .photo-container {
                width: 70px;
                height: 70px;
                border-width: 3px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .winner-cell .nombre {
                font-size: 0.75rem;
            }

            .back-button {
                padding: 10px 18px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <!-- Botón de volver -->
    <a href="{{ url_for('historial_sorteos') }}" class="btn btn-secondary back-button">
        <i class="bi bi-arrow-left"></i> Volver
    </a>

    <!-- Header -->
    <div class="header">
        <h1><i class="bi bi-trophy-fill"></i> Mural de Ganadores Palo Blanco</h1>
        <div class="stats">
            <span id="totalGanadores">0</span> ganadores registrados • 
            Actualización automática cada <span id="intervaloActual">3</span> segundos
        </div>
    </div>

    <!-- Contenedor del mural -->
    <div class="mural-container">
        <div class="winners-grid" id="winnersGrid">
            <!-- Las celdas se generarán dinámicamente -->
        </div>
        <div class="loading-message" id="loadingMessage">
            <i class="bi bi-hourglass-split"></i><br>
            Cargando ganadores...
        </div>
    </div>

    <script>
        // Configuración
        const FILAS = 3;
        const COLUMNAS = 7;
        const TOTAL_CELDAS = FILAS * COLUMNAS;
        const INTERVALO_CAMBIO = 5000; // 5 segundos por cambio

        let todosGanadores = [];
        let ganadoresMostrados = new Set();
        let intervalId = null;
        let ultimaCantidadGanadores = 0; // Para detectar cambios

        // Crear grid de celdas
        function crearGrid() {
            const grid = document.getElementById('winnersGrid');
            grid.innerHTML = '';

            for (let i = 0; i < TOTAL_CELDAS; i++) {
                const cell = document.createElement('div');
                cell.className = 'winner-cell';
                cell.id = `cell-${i}`;
                grid.appendChild(cell);
            }
        }

        // Cargar ganadores desde la API (ahora incluye foto)
        async function cargarGanadores() {
            try {
                const response = await fetch('/api/ganadores-ticker');
                const data = await response.json();

                if (data.success && data.ganadores.length > 0) {
                    todosGanadores = data.ganadores;
                    ultimaCantidadGanadores = data.total;
                    document.getElementById('totalGanadores').textContent = data.total;
                    document.getElementById('loadingMessage').style.display = 'none';
                    
                    // Iniciar animación
                    iniciarAnimacion();
                } else {
                    document.getElementById('loadingMessage').innerHTML = 
                        '<i class="bi bi-info-circle"></i><br>No hay ganadores registrados aún';
                }
            } catch (error) {
                console.error('Error al cargar ganadores:', error);
                document.getElementById('loadingMessage').innerHTML = 
                    '<i class="bi bi-exclamation-triangle"></i><br>Error al cargar ganadores';
            }
        }

        // Verificar si hay nuevos ganadores
        async function verificarNuevosGanadores() {
            try {
                const response = await fetch('/api/ganadores-ticker');
                const data = await response.json();

                if (data.success) {
                    const nuevaCantidad = data.total;
                    
                    // Si hay nuevos ganadores
                    if (nuevaCantidad > ultimaCantidadGanadores) {
                        console.log(`🎉 ¡Nuevos ganadores detectados! ${ultimaCantidadGanadores} → ${nuevaCantidad}`);
                        
                        // Mostrar notificación visual
                        mostrarNotificacion(`¡${nuevaCantidad - ultimaCantidadGanadores} nuevo(s) ganador(es)!`);
                        
                        // Actualizar datos
                        todosGanadores = data.ganadores;
                        ultimaCantidadGanadores = nuevaCantidad;
                        document.getElementById('totalGanadores').textContent = nuevaCantidad;
                        
                        // Reiniciar el set de mostrados para que los nuevos aparezcan
                        ganadoresMostrados.clear();
                    }
                }
            } catch (error) {
                console.error('Error al verificar nuevos ganadores:', error);
            }
        }

        // Mostrar notificación temporal
        function mostrarNotificacion(mensaje) {
            // Crear elemento de notificación
            const notif = document.createElement('div');
            notif.className = 'notification-popup';
            notif.innerHTML = `
                <i class="bi bi-stars"></i>
                <span>${mensaje}</span>
            `;
            document.body.appendChild(notif);

            // Animar entrada
            setTimeout(() => notif.classList.add('show'), 10);

            // Remover después de 4 segundos
            setTimeout(() => {
                notif.classList.remove('show');
                setTimeout(() => notif.remove(), 500);
            }, 4000);
        }

        // Obtener ganador aleatorio no mostrado recientemente
        function obtenerGanadorAleatorio() {
            // Si ya mostramos todos, reiniciar el set
            if (ganadoresMostrados.size >= todosGanadores.length) {
                ganadoresMostrados.clear();
            }

            // Filtrar ganadores no mostrados
            const disponibles = todosGanadores.filter((_, index) => 
                !ganadoresMostrados.has(index)
            );

            if (disponibles.length === 0) {
                ganadoresMostrados.clear();
                return todosGanadores[Math.floor(Math.random() * todosGanadores.length)];
            }

            // Seleccionar uno aleatorio
            const seleccionado = disponibles[Math.floor(Math.random() * disponibles.length)];
            const indice = todosGanadores.indexOf(seleccionado);
            ganadoresMostrados.add(indice);

            return seleccionado;
        }

        // Mostrar ganador en una celda
        function mostrarGanador(cellIndex) {
            const cell = document.getElementById(`cell-${cellIndex}`);
            const ganador = obtenerGanadorAleatorio();

            // Fadeout actual
            cell.classList.add('fadeout');

            setTimeout(() => {
                // Construir URL de la foto
                /*const fotoUrl = ganador.foto && ganador.foto.trim() && ganador.foto !== 'nan' 
                    ? `/proxy_image/${ganador.foto}` 
                    : '/static/img/placeholder.png';*/
                
                const fotoUrl = '/static/img/trofeo_ganador.png';


                // Actualizar contenido
                cell.innerHTML = `
                    <div class="trophy">🏆</div>
                    <div class="photo-container">
                        <img src="${fotoUrl}" 
                             alt="${ganador.nombre}"
                             onerror="this.src='/static/img/placeholder.png'">
                    </div>
                    <div class="nombre">${ganador.nombre}</div>
                `;

                // Fadein nuevo
                cell.classList.remove('fadeout');
                cell.classList.add('active');
            }, 600);
        }

        // Iniciar animación del mural
        function iniciarAnimacion() {
            // Mostrar ganadores iniciales en todas las celdas
            for (let i = 0; i < TOTAL_CELDAS; i++) {
                setTimeout(() => {
                    mostrarGanador(i);
                }, i * 100); // Efecto escalonado
            }

            // Cambiar ganadores periódicamente
            intervalId = setInterval(() => {
                // Seleccionar celdas aleatorias para cambiar
                const numCambios = Math.floor(Math.random() * 5) + 3; // Entre 3 y 7 cambios
                const celdasACambiar = [];

                while (celdasACambiar.length < numCambios) {
                    const randomCell = Math.floor(Math.random() * TOTAL_CELDAS);
                    if (!celdasACambiar.includes(randomCell)) {
                        celdasACambiar.push(randomCell);
                    }
                }

                // Cambiar las celdas seleccionadas
                celdasACambiar.forEach((cellIndex, i) => {
                    setTimeout(() => {
                        mostrarGanador(cellIndex);
                    }, i * 200); // Escalonado
                });

            }, INTERVALO_CAMBIO);
        }

        // Actualizar ganadores periódicamente para detectar nuevos sorteos
        setInterval(verificarNuevosGanadores, 10000); // Cada 10 segundos

        // Inicializar al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            crearGrid();
            cargarGanadores();
        });

        // Actualizar intervalo mostrado
        document.getElementById('intervaloActual').textContent = INTERVALO_CAMBIO / 1000;
    </script>
</body>
</html>
