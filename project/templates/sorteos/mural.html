<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mural de ganadores · Palo Blanco</title>
    <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root { --gold: #f5c518; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            color: #fff;
            background: radial-gradient(ellipse at top, #2c8503 0%, #133d02 45%, #071202 100%);
        }
        /* Tres columnas iguales: el título queda centrado en la pantalla y el contador a la derecha */
        header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 16px;
            padding: 1.2vh 2vw;
        }
        header h1 { grid-column: 2; }
        header .count { grid-column: 3; justify-self: end; }
        h1 {
            margin: 0;
            font-size: clamp(1.2rem, 3.6vh, 3rem);
            font-weight: 800;
            text-align: center;
            color: var(--gold);
        }
        h1 small { display: block; font-size: .5em; font-weight: 600; color: #fff; opacity: .85; }
        .count {
            min-width: 8vw;
            text-align: right;
            font-size: clamp(1rem, 3vh, 2.4rem);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
        }
        .count span { display: block; font-size: .45em; font-weight: 600; opacity: .8; }
        main { flex: 1; min-height: 0; padding: 0 2vw 2vh; }
        #mural {
            height: 100%;
            margin: 0;
            padding: 0;
            list-style: none;
            column-gap: 2vw;
            column-rule: 1px solid rgba(245, 197, 24, .2);
            column-fill: auto;
            counter-reset: ganador;
        }
        #mural li {
            display: flex;
            gap: .5em;
            padding: .18em .3em;
            border-radius: .3em;
            line-height: 1.2;
            break-inside: avoid;
        }
        #mural li b {
            min-width: 2.4em;
            text-align: right;
            color: var(--gold);
            font-variant-numeric: tabular-nums;
        }
        #mural li.is-new { animation: destello 4s ease-out; }
        @keyframes destello {
            0%, 20% { background: rgba(245, 197, 24, .85); color: #0b1a04; }
            100% { background: transparent; }
        }
        /* Banner del último ganador */
        .ultimo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.4vw;
            margin: 0 2vw 1.2vh;
            padding: 1vh 2vw;
            border: 2px solid rgba(245, 197, 24, .5);
            border-radius: 1.4vh;
            background: rgba(0, 0, 0, .25);
        }
        .ultimo__label {
            font-size: clamp(.8rem, 2vh, 1.6rem);
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            opacity: .8;
            white-space: nowrap;
        }
        .ultimo__nombre {
            font-size: clamp(1.4rem, 5.5vh, 4.5rem);
            font-weight: 800;
            line-height: 1.1;
            color: var(--gold);
            text-align: center;
        }
        .ultimo.is-new { animation: nuevo 1.2s cubic-bezier(.2, 1.4, .4, 1); border-color: var(--gold); background: rgba(245, 197, 24, .18); }
        .ultimo.is-new .ultimo__label { opacity: 1; color: var(--gold); }
        @keyframes nuevo {
            from { transform: scale(.85); opacity: 0; }
            to { transform: none; opacity: 1; }
        }
        .vacio { display: grid; place-items: center; height: 100%; font-size: 4vh; opacity: .7; }
        .fs {
            position: fixed;
            right: 12px;
            bottom: 12px;
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 50%;
            color: #fff;
            background: rgba(255, 255, 255, .15);
            cursor: pointer;
            opacity: .4;
        }
        .fs:hover { opacity: 1; }
    </style>
</head>
<body data-api-url="{{ url_for('sorteos.api_ganadores', sorteo=sorteo.id) if sorteo else url_for('sorteos.api_ganadores') }}">
    <header>
        <h1><i class="fa-solid fa-trophy"></i> Ganadores <small>{{ sorteo.nombre if sorteo else 'Todos los sorteos' }}</small></h1>
        <div class="count"><b id="total">0</b><span>ganadores</span></div>
    </header>
    <section class="ultimo" id="ultimo" hidden aria-live="polite">
        <span class="ultimo__label" id="ultimoLabel">Último ganador</span>
        <span class="ultimo__nombre" id="ultimoNombre"></span>
    </section>
    <main>
        <ol id="mural"></ol>
    </main>
    <button class="fs" id="fs" title="Pantalla completa"><i class="fa-solid fa-expand"></i></button>

    <script>
    (function () {
        const mural = document.getElementById('mural');
        const total = document.getElementById('total');
        const apiUrl = document.body.dataset.apiUrl;
        const ultimo = document.getElementById('ultimo');
        const ultimoLabel = document.getElementById('ultimoLabel');
        const ultimoNombre = document.getElementById('ultimoNombre');
        let conocidos = null;
        let temporizadorUltimo = null;

        // Muestra en grande al ganador más reciente; si acaba de salir, lo destaca unos segundos
        function mostrarUltimo(ganador, esNuevo) {
            ultimo.hidden = !ganador;
            if (!ganador) return;
            ultimoNombre.textContent = ganador.nombre;
            ultimoLabel.textContent = esNuevo ? '¡Nuevo ganador!' : 'Último ganador';
            ultimo.classList.remove('is-new');
            if (esNuevo) {
                void ultimo.offsetWidth; // Reinicia la animación
                ultimo.classList.add('is-new');
                clearTimeout(temporizadorUltimo);
                temporizadorUltimo = setTimeout(() => {
                    ultimo.classList.remove('is-new');
                    ultimoLabel.textContent = 'Último ganador';
                }, 6000);
            }
        }

        // Reduce la letra hasta que todos los nombres quepan en pantalla
        function ajustar() {
            const n = mural.children.length;
            if (!n) return;
            const alto = mural.clientHeight;
            const ancho = mural.clientWidth;
            // Estimación inicial y luego ajuste fino
            let size = Math.min(48, Math.sqrt((alto * ancho) / (n * 14)));
            mural.style.columnWidth = `${size * 13}px`;
            mural.style.fontSize = `${size}px`;
            while (size > 8 && (mural.scrollWidth > ancho + 2 || mural.scrollHeight > alto + 2)) {
                size -= 0.5;
                mural.style.fontSize = `${size}px`;
                mural.style.columnWidth = `${size * 13}px`;
            }
        }

        async function cargar() {
            try {
                const resp = await fetch(apiUrl, { headers: { Accept: 'application/json' }, cache: 'no-store' });
                if (resp.status === 401) return location.reload();
                const data = await resp.json();
                const ids = data.ganadores.map((g) => g.id).join(',');
                if (conocidos !== null && ids === conocidos.join(',')) return;

                const previos = new Set(conocidos || []);
                mural.replaceChildren();
                if (!data.ganadores.length) {
                    mural.innerHTML = '<li class="vacio">Aún no hay ganadores</li>';
                }
                data.ganadores.forEach((g, i) => {
                    const li = document.createElement('li');
                    if (conocidos !== null && !previos.has(g.id)) li.className = 'is-new';
                    const num = document.createElement('b');
                    num.textContent = i + 1;
                    const nombre = document.createElement('span');
                    nombre.textContent = g.nombre;
                    li.append(num, nombre);
                    mural.appendChild(li);
                });
                total.textContent = data.total;
                const hayNuevos = conocidos !== null && data.ganadores.some((g) => !previos.has(g.id));
                mostrarUltimo(data.ganadores[data.ganadores.length - 1], hayNuevos);
                conocidos = data.ganadores.map((g) => g.id);
                ajustar();
            } catch (err) { /* Se reintenta en el siguiente ciclo */ }
        }

        cargar();
        setInterval(cargar, 3000); // Rápido para seguir el ritmo de la ruleta
        window.addEventListener('resize', ajustar);
        document.getElementById('fs').addEventListener('click', () => {
            if (document.fullscreenElement) document.exitFullscreen();
            else document.documentElement.requestFullscreen().catch(() => {});
        });
    })();
    </script>
</body>
</html>
