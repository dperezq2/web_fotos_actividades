# Configuración FINAL con SSL. start.sh la activa cuando ya existe el certificado
# y reemplaza __DOMAIN__ por el dominio de .env (DOMAIN).

# HTTP: solo para renovar el certificado; todo lo demás se redirige a HTTPS
server {
    listen 80;
    server_name __DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    # Recomendación "intermediate" de Mozilla. Incluye cifrados ECDSA y RSA:
    # certbot 2+ emite certificados ECDSA por defecto.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Seguridad
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Fotos de hasta 25 MB cada una, varias por envío (igual que MAX_CONTENT_LENGTH de Flask)
    client_max_body_size 50M;
    client_body_buffer_size 128K;

    # Compresión de texto (las fotos ya vienen comprimidas)
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;  # Igual que el --timeout de Gunicorn (PDF, importación CSV)
    }

    location /static/ {
        alias /app/static/;
        expires 1h;  # Sin versión en la URL: un caché largo ocultaría los cambios de CSS/JS
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # Las fotos originales no son públicas: la galería usa /fotos/mini/... y /fotos/vista/...
    location /uploads/ {
        return 404;
    }
}
