# Configuración TEMPORAL: solo se usa mientras aún no existe el certificado SSL.
# Permite que Let's Encrypt valide el dominio. start.sh reemplaza __DOMAIN__.
server {
    listen 80;
    server_name __DOMAIN__;

    client_max_body_size 50M;

    # Desafío de Let's Encrypt (certbot --webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Las fotos originales no son públicas
    location /uploads/ {
        return 404;
    }

    location /static/ {
        alias /app/static/;
        expires 1h;  # Sin versión en la URL: un caché largo ocultaría los cambios de CSS/JS
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
