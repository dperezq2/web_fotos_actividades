{% extends 'base.html' %}

{% block content %}
<div class="text-center mt-5">
    <div class="spinner-border text-primary" role="status" style="width: 5rem; height: 5rem;">
        <span class="visually-hidden">Cargando...</span>
    </div>
    <h3 class="mt-4">Eligiendo ganadores al azar...</h3>

    <form id="hiddenForm" method="POST" action="{{ url_for('finalize_winner_selection') }}">
        <input type="hidden" name="num_winners" value="{{ num_winners }}">
    </form>
    
</div>

<script>
    // Enviar automáticamente el formulario después de un breve retraso
    setTimeout(function () {
        document.getElementById('hiddenForm').submit();
    }, 2000);  // Espera 2 segundos para mostrar el spinner
</script>
{% endblock %}
