services:
  sorteo-app:
    build: .
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./uploads:/app/uploads
      - ./database:/app/database
      - ./session_data:/app/.flask_session
      - ./logs:/app/logs
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      - TZ=America/Guatemala
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - SECRET_KEY=${SECRET_KEY}
      - DOMAIN=${DOMAIN:-actividades.paloblancofreshfoods.com.gt}
      - CERTBOT_EMAIL=${CERTBOT_EMAIL:-admin@paloblancofreshfoods.com.gt}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Sin límite de CPU: un límite de 2 CPU impide arrancar en una VM de 1 vCPU
    deploy:
      resources:
        limits:
          memory: 4G

  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      - TZ=America/Guatemala
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Solo accesible desde el propio equipo (no expuesto a internet).
      # 3307 en el host para no chocar con un MySQL local en 3306.
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1 (TCP) y no "localhost" (socket): durante la primera inicialización MySQL
      # levanta un servidor temporal sin red que respondería al ping antes de estar listo
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
